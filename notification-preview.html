<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aetheria messenger preview</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/notifications.css">
    <style>
        body { margin: 0; min-height: 100dvh; background: #f6f7f8; color: #282b30; }
        body.dark-mode { background: #17191c; color: #edf0f2; }
        main { max-width: 520px; margin: auto; padding: 80px 24px 340px; }
        .preview-eyebrow { font-size: 12px; color: #6a6e74; }
        h1 { margin: 28px 0 12px; font-size: 34px; font-weight: 500; line-height: 1.1; letter-spacing: -0.04em; }
        .preview-copy { max-width: 400px; font-size: 14px; line-height: 1.7; color: #6a6e74; }
        .dark-mode .preview-copy, .dark-mode .preview-eyebrow { color: #adb2ba; }
        .preview-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
        .preview-actions button { min-height: 44px; padding: 0 14px; background: transparent; color: inherit;
            border: 1px solid #dcdfe3; border-radius: 7px; font: inherit; font-size: 13px; cursor: pointer; }
        .dark-mode .preview-actions button { border-color: #3c4148; }
        .preview-actions button:hover { background: rgb(127 127 127 / 9%); }
        .preview-actions button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
        .preview-divider { margin-top: 30px; border-top: 1px solid rgb(127 127 127 / 20%); }
        @media (max-width: 480px) { main { padding-top: 32px; } h1 { font-size: 28px; } }
    </style>
</head>
<body>
    <main>
        <div class="preview-eyebrow">Aetheria ai / Messenger preview</div>
        <h1>A small friend.<br>Something to tell you.</h1>
        <p class="preview-copy">Aetheria brings updates to your corner. Click the pet to tuck its message away. Hover to pause, or swipe the bubble to dismiss.</p>
        <div class="preview-actions" aria-label="Notification examples">
            <button type="button" data-example="success">Success</button>
            <button type="button" data-example="info">Update</button>
            <button type="button" data-example="warning">Warning</button>
            <button type="button" data-example="error">Error</button>
            <button type="button" data-example="connection">Connection</button>
            <button type="button" data-example="computer">Computer</button>
            <button type="button" data-example="long">Long message</button>
        </div>
        <div class="preview-divider"></div>
        <div class="preview-actions" aria-label="Preview controls">
            <button type="button" id="theme" aria-pressed="false">Dark theme</button>
            <button type="button" id="burst">Message burst</button>
            <button type="button" id="clear">Dismiss all</button>
        </div>
    </main>
    <script src="js/notification-service.js"></script>
    <script>
        const examples = {
            success: () => notificationService.show('All saved. You can carry on.', 'success', 8000),
            info: () => notificationService.show('Your export is ready in Downloads.', 'info', 8000),
            warning: () => notificationService.show('Microphone access is off. Enable it in system settings to use voice input.', 'warning', 10000),
            error: () => notificationService.show('That file did not upload. Check your connection and try again.', 'error', 10000),
            connection: () => notificationService.showConnection('I lost the connection. Your conversation is safe.', true),
            computer: () => notificationService.showComputerTool('Screenshot captured', 'screenshot'),
            long: () => notificationService.show('The upload could not finish because the connection to the server was interrupted. Your original file and conversation are safe. Reconnect to the internet, then attach the file again. If the problem continues, try a smaller file or check whether the server is available.', 'error', 12000)
        };
        document.querySelectorAll('[data-example]').forEach(button => {
            button.addEventListener('click', () => examples[button.dataset.example]());
        });
        document.getElementById('theme').addEventListener('click', event => {
            const dark = document.body.classList.toggle('dark-mode');
            event.currentTarget.setAttribute('aria-pressed', String(dark));
            event.currentTarget.textContent = dark ? 'Light theme' : 'Dark theme';
        });
        document.getElementById('clear').addEventListener('click', () => notificationService.clear());
        document.getElementById('burst').addEventListener('click', () => {
            examples.success(); examples.info(); examples.computer();
        });
        // A preview-only bridge simulates recovery. The app uses Electron IPC.
        window.ipcRenderer = { send: () => {
            notificationService.showConnection('Checking the connection…');
            window.setTimeout(() => {
                notificationService.removeConnectionNotifications();
                notificationService.show('Back online. Ready when you are.', 'success', 8000);
            }, 1800);
        } };
    </script>
</body>
</html>
